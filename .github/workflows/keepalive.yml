name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          URL=$(echo "$RAW_URL" | tr -d '[:space:]')
          URL="${URL%/}"
          KEY=$(echo "$RAW_KEY" | tr -d '[:space:]')
          CODE=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
            "$URL/rest/v1/situations?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "HTTP $CODE"
          cat /tmp/body.txt
          [ "$CODE" = "200" ] || exit 1
